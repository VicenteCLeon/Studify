<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 614" width="800" height="614" role="img" aria-labelledby="esq-titulo esq-desc" font-family="Figtree, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">
<title id="esq-titulo">Dependencias funcionales</title>
<desc id="esq-desc">Mapa conceptual: una dependencia funcional se denota X → Y, por ejemplo RUT → Nombre, y puede ser plena, transitiva o trivial.</desc>
<rect width="800" height="614" rx="20" fill="#FBF8F3"/>
<text x="400.0" y="58" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#1F2933">Dependencias funcionales</text>
<rect x="364.0" y="74" width="72" height="4" rx="2" fill="#F2795A"/>
<line x1="313.0" y1="237.2" x2="203.2" y2="312.6" stroke="#56606B" stroke-width="2"/><polygon points="196.6,317.1 202.9,306.9 208.4,314.9" fill="#56606B"/><rect x="215.0" y="266.2" width="79.5" height="22" rx="11" fill="#FBF8F3"/><text x="254.8" y="281.7" text-anchor="middle" font-size="13" font-style="italic" fill="#56606B">se denota</text>
<line x1="366.2" y1="247.1" x2="335.7" y2="309.9" stroke="#56606B" stroke-width="2"/><polygon points="332.2,317.1 332.6,305.1 341.4,309.4" fill="#56606B"/><rect x="309.4" y="271.1" width="79.5" height="22" rx="11" fill="#FBF8F3"/><text x="349.2" y="286.6" text-anchor="middle" font-size="13" font-style="italic" fill="#56606B">puede ser</text>
<line x1="433.8" y1="247.1" x2="464.3" y2="309.9" stroke="#56606B" stroke-width="2"/><polygon points="467.8,317.1 458.6,309.4 467.4,305.1" fill="#56606B"/><rect x="411.0" y="271.1" width="79.5" height="22" rx="11" fill="#FBF8F3"/><text x="450.8" y="286.6" text-anchor="middle" font-size="13" font-style="italic" fill="#56606B">puede ser</text>
<line x1="487.0" y1="237.2" x2="596.8" y2="312.6" stroke="#56606B" stroke-width="2"/><polygon points="603.4,317.1 591.6,314.9 597.1,306.9" fill="#56606B"/><rect x="505.4" y="266.2" width="79.5" height="22" rx="11" fill="#FBF8F3"/><text x="545.2" y="281.7" text-anchor="middle" font-size="13" font-style="italic" fill="#56606B">puede ser</text>
<line x1="124.0" y1="416.8" x2="124.0" y2="478.8" stroke="#56606B" stroke-width="2"/><polygon points="124.0,486.8 119.1,475.8 128.9,475.8" fill="#56606B"/><rect x="77.0" y="440.8" width="94.1" height="22" rx="11" fill="#FBF8F3"/><text x="124.0" y="456.2" text-anchor="middle" font-size="13" font-style="italic" fill="#56606B">por ejemplo</text>
<rect x="317.0" y="112.0" width="166.0" height="131.1" rx="14" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<text x="400.0" y="142.2" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">Dependencia</text>
<text x="400.0" y="163.4" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">funcional</text>
<text x="400.0" y="187.8" text-anchor="middle" font-size="14" fill="#FFFFFF">Restricción entre</text>
<text x="400.0" y="206.0" text-anchor="middle" font-size="14" fill="#FFFFFF">conjuntos de</text>
<text x="400.0" y="224.2" text-anchor="middle" font-size="14" fill="#FFFFFF">atributos</text>
<rect x="41.0" y="321.1" width="166.0" height="91.7" rx="14" fill="#FFFFFF" stroke="#D3C9B8" stroke-width="2"/>
<text x="124.0" y="351.2" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2933">X → Y</text>
<text x="124.0" y="375.6" text-anchor="middle" font-size="14" fill="#56606B">X determina</text>
<text x="124.0" y="393.8" text-anchor="middle" font-size="14" fill="#56606B">funcionalmente a Y</text>
<rect x="225.0" y="321.1" width="166.0" height="91.7" rx="14" fill="#FFFFFF" stroke="#D3C9B8" stroke-width="2"/>
<text x="308.0" y="351.2" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2933">DF plena</text>
<text x="308.0" y="375.6" text-anchor="middle" font-size="14" fill="#56606B">Depende de X</text>
<text x="308.0" y="393.8" text-anchor="middle" font-size="14" fill="#56606B">completo</text>
<rect x="409.0" y="321.1" width="166.0" height="91.7" rx="14" fill="#FFFFFF" stroke="#D3C9B8" stroke-width="2"/>
<text x="492.0" y="351.2" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2933">DF transitiva</text>
<text x="492.0" y="375.6" text-anchor="middle" font-size="14" fill="#56606B">X → Z a través de</text>
<text x="492.0" y="393.8" text-anchor="middle" font-size="14" fill="#56606B">Y</text>
<rect x="593.0" y="321.1" width="166.0" height="91.7" rx="14" fill="#FFFFFF" stroke="#D3C9B8" stroke-width="2"/>
<text x="676.0" y="351.2" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2933">DF trivial</text>
<text x="676.0" y="375.6" text-anchor="middle" font-size="14" fill="#56606B">Y es subconjunto</text>
<text x="676.0" y="393.8" text-anchor="middle" font-size="14" fill="#56606B">de X</text>
<rect x="41.0" y="490.8" width="166.0" height="91.7" rx="14" fill="#FDEBE5" stroke="#F2795A" stroke-width="2"/>
<text x="124.0" y="520.9" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2933">RUT → Nombre</text>
<text x="124.0" y="545.3" text-anchor="middle" font-size="14" fill="#56606B">Mismo RUT, mismo</text>
<text x="124.0" y="563.5" text-anchor="middle" font-size="14" fill="#56606B">nombre</text>
</svg>
