<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 660" width="800" height="660" role="img" aria-labelledby="esq-titulo esq-desc" font-family="Figtree, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">
<title id="esq-titulo">¿Cómo mejora un diseño?</title>
<desc id="esq-desc">Ciclo de cuatro etapas: el análisis guía el diseño, el diseño se construye, la construcción se evalúa y la evaluación retroalimenta el análisis.</desc>
<rect width="800" height="660" rx="20" fill="#FBF8F3"/>
<text x="400.0" y="58" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#1F2933">¿Cómo mejora un diseño?</text>
<rect x="364.0" y="74" width="72" height="4" rx="2" fill="#C27D0E"/>
<line x1="463.7" y1="210.1" x2="593.1" y2="313.9" stroke="#56606B" stroke-width="2"/><polygon points="599.3,318.9 587.7,315.9 593.8,308.3" fill="#56606B"/><rect x="509.9" y="253.5" width="43.1" height="22" rx="11" fill="#FBF8F3"/><text x="531.5" y="269.0" text-anchor="middle" font-size="13" font-style="italic" fill="#56606B">guía</text>
<line x1="599.3" y1="421.1" x2="469.9" y2="524.8" stroke="#56606B" stroke-width="2"/><polygon points="463.7,529.8 469.2,519.2 475.3,526.8" fill="#56606B"/><rect x="480.8" y="464.5" width="101.4" height="22" rx="11" fill="#FBF8F3"/><text x="531.5" y="480.0" text-anchor="middle" font-size="13" font-style="italic" fill="#56606B">se construye</text>
<line x1="336.3" y1="529.8" x2="206.9" y2="426.1" stroke="#56606B" stroke-width="2"/><polygon points="200.7,421.1 212.3,424.1 206.2,431.7" fill="#56606B"/><rect x="228.7" y="464.5" width="79.5" height="22" rx="11" fill="#FBF8F3"/><text x="268.5" y="480.0" text-anchor="middle" font-size="13" font-style="italic" fill="#56606B">se evalúa</text>
<line x1="200.7" y1="318.9" x2="330.1" y2="215.2" stroke="#56606B" stroke-width="2"/><polygon points="336.3,210.1 330.8,220.8 324.7,213.2" fill="#56606B"/><rect x="214.2" y="253.5" width="108.6" height="22" rx="11" fill="#FBF8F3"/><text x="268.5" y="269.0" text-anchor="middle" font-size="13" font-style="italic" fill="#56606B">retroalimenta</text>
<rect x="295.0" y="112.0" width="210.0" height="94.2" rx="14" fill="#1E52B8" stroke="#1E52B8" stroke-width="2"/>
<text x="400.0" y="144.0" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">Análisis</text>
<text x="400.0" y="169.0" text-anchor="middle" font-size="14" fill="#FFFFFF">¿Qué necesita el</text>
<text x="400.0" y="187.2" text-anchor="middle" font-size="14" fill="#FFFFFF">usuario?</text>
<rect x="558.0" y="322.9" width="210.0" height="94.2" rx="14" fill="#FFFFFF" stroke="#D3C9B8" stroke-width="2"/>
<text x="663.0" y="355.0" text-anchor="middle" font-size="19" font-weight="700" fill="#1F2933">Diseño</text>
<text x="663.0" y="380.0" text-anchor="middle" font-size="14" fill="#56606B">Bosquejo pequeño y</text>
<text x="663.0" y="398.2" text-anchor="middle" font-size="14" fill="#56606B">rápido</text>
<rect x="295.0" y="533.8" width="210.0" height="94.2" rx="14" fill="#FFFFFF" stroke="#D3C9B8" stroke-width="2"/>
<text x="400.0" y="565.9" text-anchor="middle" font-size="19" font-weight="700" fill="#1F2933">Construcción</text>
<text x="400.0" y="590.9" text-anchor="middle" font-size="14" fill="#56606B">Versión mínima que</text>
<text x="400.0" y="609.1" text-anchor="middle" font-size="14" fill="#56606B">funciona</text>
<rect x="32.0" y="322.9" width="210.0" height="94.2" rx="14" fill="#FDF2DD" stroke="#C27D0E" stroke-width="2"/>
<text x="137.0" y="364.1" text-anchor="middle" font-size="19" font-weight="700" fill="#1F2933">Evaluación</text>
<text x="137.0" y="389.1" text-anchor="middle" font-size="14" fill="#56606B">¡Medir antes de opinar!</text>
</svg>
