<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 732" width="800" height="732" role="img" aria-labelledby="esq-titulo esq-desc" font-family="Figtree, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">
<title id="esq-titulo">Cómo llevar una tabla a 1FN</title>
<desc id="esq-desc">Diagrama de flujo de cinco pasos: una tabla no normalizada se revisa para identificar la celda no atómica, se descompone en filas, se define la clave primaria y queda una tabla en primera forma normal.</desc>
<rect width="800" height="732" rx="20" fill="#FBF8F3"/>
<text x="400.0" y="58" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#1F2933">Cómo llevar una tabla a 1FN</text>
<rect x="364.0" y="74" width="72" height="4" rx="2" fill="#F2795A"/>
<circle cx="152.0" cy="150.0" r="17" fill="#E3F4F1" stroke="#0F766E" stroke-width="2"/><text x="152.0" y="155.5" text-anchor="middle" font-size="16" font-weight="700" fill="#0F766E">1</text>
<rect x="190.0" y="112.0" width="460.0" height="76.0" rx="14" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<text x="420.0" y="144.1" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">Tabla no normalizada</text>
<text x="420.0" y="169.1" text-anchor="middle" font-size="14" fill="#FFFFFF">Una celda guarda varias asignaturas</text>
<line x1="420.0" y1="191.9" x2="420.0" y2="228.0" stroke="#56606B" stroke-width="2"/><polygon points="420.0,236.0 415.1,225.0 424.9,225.0" fill="#56606B"/>
<rect x="429.0" y="202.9" width="79.5" height="22" rx="11" fill="#FBF8F3"/><text x="436.0" y="218.4" text-anchor="start" font-size="13" font-style="italic" fill="#56606B">se revisa</text>
<circle cx="152.0" cy="277.9" r="17" fill="#E3F4F1" stroke="#0F766E" stroke-width="2"/><text x="152.0" y="283.4" text-anchor="middle" font-size="16" font-weight="700" fill="#0F766E">2</text>
<rect x="190.0" y="240.0" width="460.0" height="76.0" rx="14" fill="#FFFFFF" stroke="#D3C9B8" stroke-width="2"/>
<text x="420.0" y="272.0" text-anchor="middle" font-size="19" font-weight="700" fill="#1F2933">Identificar celda no atómica</text>
<text x="420.0" y="297.0" text-anchor="middle" font-size="14" fill="#56606B">Listas separadas por comas o guiones</text>
<line x1="420.0" y1="319.9" x2="420.0" y2="355.9" stroke="#56606B" stroke-width="2"/><polygon points="420.0,363.9 415.1,352.9 424.9,352.9" fill="#56606B"/>
<rect x="429.0" y="330.9" width="79.5" height="22" rx="11" fill="#FBF8F3"/><text x="436.0" y="346.4" text-anchor="start" font-size="13" font-style="italic" fill="#56606B">se divide</text>
<circle cx="152.0" cy="405.9" r="17" fill="#E3F4F1" stroke="#0F766E" stroke-width="2"/><text x="152.0" y="411.4" text-anchor="middle" font-size="16" font-weight="700" fill="#0F766E">3</text>
<rect x="190.0" y="367.9" width="460.0" height="76.0" rx="14" fill="#FFFFFF" stroke="#D3C9B8" stroke-width="2"/>
<text x="420.0" y="399.9" text-anchor="middle" font-size="19" font-weight="700" fill="#1F2933">Descomponer en filas</text>
<text x="420.0" y="424.9" text-anchor="middle" font-size="14" fill="#56606B">Una fila por cada valor</text>
<line x1="420.0" y1="447.9" x2="420.0" y2="483.8" stroke="#56606B" stroke-width="2"/><polygon points="420.0,491.8 415.1,480.9 424.9,480.9" fill="#56606B"/>
<rect x="429.0" y="458.8" width="108.6" height="22" rx="11" fill="#FBF8F3"/><text x="436.0" y="474.3" text-anchor="start" font-size="13" font-style="italic" fill="#56606B">se identifica</text>
<circle cx="152.0" cy="533.8" r="17" fill="#E3F4F1" stroke="#0F766E" stroke-width="2"/><text x="152.0" y="539.3" text-anchor="middle" font-size="16" font-weight="700" fill="#0F766E">4</text>
<rect x="190.0" y="495.8" width="460.0" height="76.0" rx="14" fill="#FFFFFF" stroke="#D3C9B8" stroke-width="2"/>
<text x="420.0" y="527.9" text-anchor="middle" font-size="19" font-weight="700" fill="#1F2933">Definir clave primaria</text>
<text x="420.0" y="552.9" text-anchor="middle" font-size="14" fill="#56606B">Incluye la columna descompuesta</text>
<line x1="420.0" y1="575.8" x2="420.0" y2="611.8" stroke="#56606B" stroke-width="2"/><polygon points="420.0,619.8 415.1,608.8 424.9,608.8" fill="#56606B"/>
<rect x="429.0" y="586.8" width="65.0" height="22" rx="11" fill="#FBF8F3"/><text x="436.0" y="602.3" text-anchor="start" font-size="13" font-style="italic" fill="#56606B">produce</text>
<circle cx="152.0" cy="661.8" r="17" fill="#E3F4F1" stroke="#0F766E" stroke-width="2"/><text x="152.0" y="667.3" text-anchor="middle" font-size="16" font-weight="700" fill="#0F766E">5</text>
<rect x="190.0" y="623.8" width="460.0" height="76.0" rx="14" fill="#FDEBE5" stroke="#F2795A" stroke-width="2"/>
<text x="420.0" y="655.8" text-anchor="middle" font-size="19" font-weight="700" fill="#1F2933">Tabla en 1FN</text>
<text x="420.0" y="680.8" text-anchor="middle" font-size="14" fill="#56606B">Valores atómicos y clave única</text>
</svg>
