<rect x="225.0" y="112.0" width="227.3" height="117.9" rx="14" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<text x="338.7" y="144.0" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">Estructuras de</text>
<text x="338.7" y="167.8" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">control</text>
<text x="338.7" y="192.8" text-anchor="middle" font-size="14" fill="#FFFFFF">Rompen la ejecución</text>
<text x="338.7" y="211.0" text-anchor="middle" font-size="14" fill="#FFFFFF">secuencial</text>
<rect x="41.0" y="307.9" width="227.3" height="76.0" rx="14" fill="#FFFFFF" stroke="#D3C9B8" stroke-width="2"/>
<text x="154.7" y="339.9" text-anchor="middle" font-size="19" font-weight="700" fill="#1F2933">Selectivas</text>
<text x="154.7" y="364.9" text-anchor="middle" font-size="14" fill="#56606B">Evalúan una condición</text>
<rect x="409.0" y="307.9" width="227.3" height="76.0" rx="14" fill="#FFFFFF" stroke="#D3C9B8" stroke-width="2"/>
<text x="522.7" y="339.9" text-anchor="middle" font-size="19" font-weight="700" fill="#1F2933">Iterativas</text>
<text x="522.7" y="364.9" text-anchor="middle" font-size="14" fill="#56606B">Repiten un bloque</text>
<rect x="41.0" y="461.8" width="227.3" height="94.2" rx="14" fill="#FDEBE5" stroke="#F2795A" stroke-width="2"/>
<text x="154.7" y="503.0" text-anchor="middle" font-size="19" font-weight="700" fill="#1F2933">if, elif, else</text>
<text x="154.7" y="528.0" text-anchor="middle" font-size="14" fill="#56606B">Ejecuta una sola rama</text>
<rect x="286.3" y="461.8" width="227.3" height="94.2" rx="14" fill="#FDEBE5" stroke="#F2795A" stroke-width="2"/>
<text x="400.0" y="493.9" text-anchor="middle" font-size="19" font-weight="700" fill="#1F2933">for</text>
<text x="400.0" y="518.9" text-anchor="middle" font-size="14" fill="#56606B">Número fijo de</text>
<text x="400.0" y="537.1" text-anchor="middle" font-size="14" fill="#56606B">repeticiones</text>
<rect x="531.7" y="461.8" width="227.3" height="94.2" rx="14" fill="#FDEBE5" stroke="#F2795A" stroke-width="2"/>
<text x="645.3" y="493.9" text-anchor="middle" font-size="19" font-weight="700" fill="#1F2933">while</text>
<text x="645.3" y="518.9" text-anchor="middle" font-size="14" fill="#56606B">Mientras la condición sea</text>
<text x="645.3" y="537.1" text-anchor="middle" font-size="14" fill="#56606B">True</text>
