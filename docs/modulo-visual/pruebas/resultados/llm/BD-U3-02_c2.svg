<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 505" width="800" height="505" role="img" aria-labelledby="esq-titulo esq-desc" font-family="Figtree, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">
<title id="esq-titulo">Dependencias Funcionales y Cierre</title>
<desc id="esq-desc">El esquema muestra la Dependencia Funcional como concepto central, del cual se desprenden tres tipos: plena, transitiva y trivial. Además, la Dependencia Funcional permite calcular el Cierre de Atributos.</desc>
<rect width="800" height="505" rx="20" fill="#FBF8F3"/>
<text x="400.0" y="58" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#1F2933">Dependencias Funcionales y Cierre</text>
<rect x="364.0" y="74" width="72" height="4" rx="2" fill="#F2795A"/>
<line x1="313.0" y1="246.8" x2="217.3" y2="323.0" stroke="#56606B" stroke-width="2"/><polygon points="211.0,328.0 216.5,317.4 222.6,325.0" fill="#56606B"/><rect x="200.4" y="276.4" width="123.2" height="22" rx="11" fill="#FBF8F3"/><text x="262.0" y="291.9" text-anchor="middle" font-size="13" font-style="italic" fill="#56606B">se clasifica en</text>
<line x1="370.9" y1="247.1" x2="344.7" y2="309.7" stroke="#56606B" stroke-width="2"/><polygon points="341.6,317.1 341.3,305.1 350.3,308.9" fill="#56606B"/><rect x="294.6" y="271.1" width="123.2" height="22" rx="11" fill="#FBF8F3"/><text x="356.2" y="286.6" text-anchor="middle" font-size="13" font-style="italic" fill="#56606B">se clasifica en</text>
<line x1="429.1" y1="247.1" x2="455.3" y2="309.7" stroke="#56606B" stroke-width="2"/><polygon points="458.4,317.1 449.7,308.9 458.7,305.1" fill="#56606B"/><rect x="382.2" y="271.1" width="123.2" height="22" rx="11" fill="#FBF8F3"/><text x="443.8" y="286.6" text-anchor="middle" font-size="13" font-style="italic" fill="#56606B">se clasifica en</text>
<line x1="487.0" y1="246.8" x2="582.7" y2="323.0" stroke="#56606B" stroke-width="2"/><polygon points="589.0,328.0 577.4,325.0 583.5,317.4" fill="#56606B"/><rect x="472.8" y="276.4" width="130.5" height="22" rx="11" fill="#FBF8F3"/><text x="538.0" y="291.9" text-anchor="middle" font-size="13" font-style="italic" fill="#56606B">permite calcular</text>
<rect x="317.0" y="112.0" width="166.0" height="131.1" rx="14" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<text x="400.0" y="142.2" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">Dependencia</text>
<text x="400.0" y="163.4" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">Funcional</text>
<text x="400.0" y="187.8" text-anchor="middle" font-size="14" fill="#FFFFFF">Restricción entre</text>
<text x="400.0" y="206.0" text-anchor="middle" font-size="14" fill="#FFFFFF">conjuntos de</text>
<text x="400.0" y="224.2" text-anchor="middle" font-size="14" fill="#FFFFFF">atributos</text>
<rect x="41.0" y="321.1" width="166.0" height="152.3" rx="14" fill="#FFFFFF" stroke="#D3C9B8" stroke-width="2"/>
<text x="124.0" y="351.2" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2933">Dependencia</text>
<text x="124.0" y="372.5" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2933">Funcional</text>
<text x="124.0" y="393.8" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2933">Plena</text>
<text x="124.0" y="418.1" text-anchor="middle" font-size="14" fill="#56606B">Y depende de X, no</text>
<text x="124.0" y="436.3" text-anchor="middle" font-size="14" fill="#56606B">de subconjunto</text>
<text x="124.0" y="454.5" text-anchor="middle" font-size="14" fill="#56606B">propio</text>
<rect x="225.0" y="321.1" width="166.0" height="152.3" rx="14" fill="#FFFFFF" stroke="#D3C9B8" stroke-width="2"/>
<text x="308.0" y="371.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2933">Dependencia</text>
<text x="308.0" y="392.2" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2933">Transitiva</text>
<text x="308.0" y="416.6" text-anchor="middle" font-size="14" fill="#56606B">Si X→Y y Y→Z,</text>
<text x="308.0" y="434.8" text-anchor="middle" font-size="14" fill="#56606B">entonces X→Z</text>
<rect x="409.0" y="321.1" width="166.0" height="152.3" rx="14" fill="#FFFFFF" stroke="#D3C9B8" stroke-width="2"/>
<text x="492.0" y="371.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2933">Dependencia</text>
<text x="492.0" y="392.2" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2933">Trivial</text>
<text x="492.0" y="416.6" text-anchor="middle" font-size="14" fill="#56606B">Y es subconjunto</text>
<text x="492.0" y="434.8" text-anchor="middle" font-size="14" fill="#56606B">de X</text>
<rect x="593.0" y="321.1" width="166.0" height="152.3" rx="14" fill="#FDEBE5" stroke="#F2795A" stroke-width="2"/>
<text x="676.0" y="361.9" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2933">Cierre de</text>
<text x="676.0" y="383.1" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2933">Atributos</text>
<text x="676.0" y="407.5" text-anchor="middle" font-size="14" fill="#56606B">Algoritmo</text>
<text x="676.0" y="425.7" text-anchor="middle" font-size="14" fill="#56606B">iterativo de</text>
<text x="676.0" y="443.9" text-anchor="middle" font-size="14" fill="#56606B">cálculo</text>
</svg>
