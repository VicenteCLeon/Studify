<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 505" width="800" height="505" role="img" aria-labelledby="esq-titulo esq-desc" font-family="Figtree, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">
<title id="esq-titulo">Primera Forma Normal: Reglas y Proceso</title>
<desc id="esq-desc">La Primera Forma Normal se define por tres reglas: atomicidad de atributos, eliminación de grupos repetitivos y clave primaria definida. Además, se resuelve mediante un proceso paso a paso.</desc>
<rect width="800" height="505" rx="20" fill="#FBF8F3"/>
<text x="400.0" y="58" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#1F2933">Primera Forma Normal: Reglas y Proceso</text>
<rect x="364.0" y="74" width="72" height="4" rx="2" fill="#F2795A"/>
<line x1="313.0" y1="246.8" x2="217.3" y2="323.0" stroke="#56606B" stroke-width="2"/><polygon points="211.0,328.0 216.5,317.4 222.6,325.0" fill="#56606B"/><rect x="225.9" y="276.4" width="72.2" height="22" rx="11" fill="#FBF8F3"/><text x="262.0" y="291.9" text-anchor="middle" font-size="13" font-style="italic" fill="#56606B">requiere</text>
<line x1="370.9" y1="247.1" x2="344.7" y2="309.7" stroke="#56606B" stroke-width="2"/><polygon points="341.6,317.1 341.3,305.1 350.3,308.9" fill="#56606B"/><rect x="320.1" y="271.1" width="72.2" height="22" rx="11" fill="#FBF8F3"/><text x="356.2" y="286.6" text-anchor="middle" font-size="13" font-style="italic" fill="#56606B">requiere</text>
<line x1="429.1" y1="247.1" x2="455.3" y2="309.7" stroke="#56606B" stroke-width="2"/><polygon points="458.4,317.1 449.7,308.9 458.7,305.1" fill="#56606B"/><rect x="407.7" y="271.1" width="72.2" height="22" rx="11" fill="#FBF8F3"/><text x="443.8" y="286.6" text-anchor="middle" font-size="13" font-style="italic" fill="#56606B">requiere</text>
<line x1="487.0" y1="246.8" x2="582.7" y2="323.0" stroke="#56606B" stroke-width="2"/><polygon points="589.0,328.0 577.4,325.0 583.5,317.4" fill="#56606B"/><rect x="465.5" y="276.4" width="145.0" height="22" rx="11" fill="#FBF8F3"/><text x="538.0" y="291.9" text-anchor="middle" font-size="13" font-style="italic" fill="#56606B">se aplica mediante</text>
<rect x="317.0" y="112.0" width="166.0" height="131.1" rx="14" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<text x="400.0" y="142.2" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">Primera Forma</text>
<text x="400.0" y="163.4" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">Normal</text>
<text x="400.0" y="187.8" text-anchor="middle" font-size="14" fill="#FFFFFF">Nivel básico de</text>
<text x="400.0" y="206.0" text-anchor="middle" font-size="14" fill="#FFFFFF">normalización</text>
<text x="400.0" y="224.2" text-anchor="middle" font-size="14" fill="#FFFFFF">relacional</text>
<rect x="41.0" y="321.1" width="166.0" height="152.3" rx="14" fill="#FFFFFF" stroke="#D3C9B8" stroke-width="2"/>
<text x="124.0" y="361.9" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2933">Atomicidad de</text>
<text x="124.0" y="383.1" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2933">Atributos</text>
<text x="124.0" y="407.5" text-anchor="middle" font-size="14" fill="#56606B">Valores</text>
<text x="124.0" y="425.7" text-anchor="middle" font-size="14" fill="#56606B">indivisibles en</text>
<text x="124.0" y="443.9" text-anchor="middle" font-size="14" fill="#56606B">cada celda</text>
<rect x="225.0" y="321.1" width="166.0" height="152.3" rx="14" fill="#FFFFFF" stroke="#D3C9B8" stroke-width="2"/>
<text x="308.0" y="351.2" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2933">Eliminación</text>
<text x="308.0" y="372.5" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2933">de Grupos</text>
<text x="308.0" y="393.8" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2933">Repetitivos</text>
<text x="308.0" y="418.1" text-anchor="middle" font-size="14" fill="#56606B">Sin columnas</text>
<text x="308.0" y="436.3" text-anchor="middle" font-size="14" fill="#56606B">repetidas del</text>
<text x="308.0" y="454.5" text-anchor="middle" font-size="14" fill="#56606B">mismo tipo</text>
<rect x="409.0" y="321.1" width="166.0" height="152.3" rx="14" fill="#FFFFFF" stroke="#D3C9B8" stroke-width="2"/>
<text x="492.0" y="351.2" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2933">Clave</text>
<text x="492.0" y="372.5" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2933">Primaria</text>
<text x="492.0" y="393.8" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2933">Definida</text>
<text x="492.0" y="418.1" text-anchor="middle" font-size="14" fill="#56606B">Identifica de</text>
<text x="492.0" y="436.3" text-anchor="middle" font-size="14" fill="#56606B">forma unívoca cada</text>
<text x="492.0" y="454.5" text-anchor="middle" font-size="14" fill="#56606B">fila</text>
<rect x="593.0" y="321.1" width="166.0" height="152.3" rx="14" fill="#FFFFFF" stroke="#D3C9B8" stroke-width="2"/>
<text x="676.0" y="381.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2933">Paso a Paso</text>
<text x="676.0" y="406.0" text-anchor="middle" font-size="14" fill="#56606B">Resolver</text>
<text x="676.0" y="424.2" text-anchor="middle" font-size="14" fill="#56606B">violaciones de 1FN</text>
</svg>
