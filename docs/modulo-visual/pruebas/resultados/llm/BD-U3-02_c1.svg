<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 469" width="800" height="469" role="img" aria-labelledby="esq-titulo esq-desc" font-family="Figtree, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">
<title id="esq-titulo">Dependencias Funcionales y Cierre</title>
<desc id="esq-desc">Esquema conceptual que muestra la Dependencia Funcional como concepto principal, del cual se derivan tres tipos: plena, transitiva y trivial. Además, la Dependencia Funcional permite calcular el Cierre de Atributos mediante un algoritmo iterativo.</desc>
