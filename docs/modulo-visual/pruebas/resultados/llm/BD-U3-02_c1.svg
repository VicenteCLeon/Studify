<text x="492.0" y="374.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2933">Trivial</text>
<text x="492.0" y="398.4" text-anchor="middle" font-size="14" fill="#56606B">Y subconjunto de X</text>
<rect x="593.0" y="302.9" width="166.0" height="134.2" rx="14" fill="#FDEBE5" stroke="#F2795A" stroke-width="2"/>
<text x="676.0" y="334.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2933">Cierre de</text>
<text x="676.0" y="355.8" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2933">Atributos</text>
<text x="676.0" y="380.2" text-anchor="middle" font-size="14" fill="#56606B">Algoritmo</text>
<text x="676.0" y="398.4" text-anchor="middle" font-size="14" fill="#56606B">iterativo de</text>
<text x="676.0" y="416.6" text-anchor="middle" font-size="14" fill="#56606B">cálculo</text>
