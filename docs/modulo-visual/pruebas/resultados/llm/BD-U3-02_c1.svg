<line x1="482.8" y1="228.9" x2="582.5" y2="301.7" stroke="#56606B" stroke-width="2"/><polygon points="589.0,306.5 577.3,303.9 583.0,296.0" fill="#56606B"/><rect x="470.7" y="256.7" width="130.5" height="22" rx="11" fill="#FBF8F3"/><text x="535.9" y="272.2" text-anchor="middle" font-size="13" font-style="italic" fill="#56606B">permite calcular</text>
<rect x="317.0" y="112.0" width="166.0" height="112.9" rx="14" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<text x="400.0" y="142.1" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">Dependencia</text>
<text x="400.0" y="163.4" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">Funcional</text>
<text x="400.0" y="187.8" text-anchor="middle" font-size="14" fill="#FFFFFF">X determina</text>
<text x="400.0" y="206.0" text-anchor="middle" font-size="14" fill="#FFFFFF">funcionalmente a Y</text>
<rect x="41.0" y="302.9" width="166.0" height="134.2" rx="14" fill="#FFFFFF" stroke="#D3C9B8" stroke-width="2"/>
<text x="124.0" y="333.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2933">Dependencia</text>
<text x="124.0" y="354.3" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2933">Funcional</text>
<text x="124.0" y="375.5" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2933">Plena</text>
<text x="124.0" y="399.9" text-anchor="middle" font-size="14" fill="#56606B">Y no depende de</text>
<text x="124.0" y="418.1" text-anchor="middle" font-size="14" fill="#56606B">subconjunto propio</text>
<rect x="225.0" y="302.9" width="166.0" height="134.2" rx="14" fill="#FFFFFF" stroke="#D3C9B8" stroke-width="2"/>
<text x="308.0" y="343.7" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2933">Dependencia</text>
<text x="308.0" y="364.9" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2933">Transitiva</text>
<text x="308.0" y="389.3" text-anchor="middle" font-size="14" fill="#56606B">X→Y y Y→Z implica</text>
<text x="308.0" y="407.5" text-anchor="middle" font-size="14" fill="#56606B">X→Z</text>
