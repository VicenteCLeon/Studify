<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 612" width="800" height="612" role="img" aria-labelledby="esq-titulo esq-desc" font-family="Figtree, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">
<title id="esq-titulo">Variables y Tipos de Datos</title>
<desc id="esq-desc">El esquema muestra que una variable es una ubicación en memoria RAM asociada a un identificador simbólico y que almacena un valor de un tipo de dato específico. Los tipos de datos primitivos incluidos son int, float, bool y str.</desc>
