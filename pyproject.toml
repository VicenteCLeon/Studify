[project]
name = "studify"
version = "0.1.0"
description = "Generación de micro-aprendizaje adaptativo mediante IA generativa y RAG estructurado sobre base de datos relacional"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "llama-index-core>=0.12",
    "llama-index-llms-openai-like>=0.3",
]

[project.optional-dependencies]
# Ingesta documental (Fase 2). Se instala aparte para no arrastrar binarios pesados
# mientras se trabaja en las fases 0-1.
ingest = [
    "pymupdf>=1.24",
    "python-pptx>=1.0",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studify"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
