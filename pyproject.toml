[project]
name = "studify"
version = "0.1.0"
description = "Generación de micro-aprendizaje adaptativo mediante IA generativa y RAG estructurado sobre base de datos relacional"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "llama-index-core>=0.12",
    "llama-index-llms-openai-like>=0.3",
]

[project.optional-dependencies]
# Narración del visor (perfil auditivo): Kokoro por defecto y Piper como opción
# rápida, ambos sobre ONNX en CPU. Traen espeak-ng empaquetado, así que en
# Windows no hay que instalar nada aparte. Licencias: piper-tts, phonemizer y
# espeak-ng son GPL-3.0 (riesgo abierto, ver PRUEBAS_VARK.md).
# Versiones exactas: son las medidas en PRUEBAS_VARK.md, y los modelos que baja
# `scripts/descargar_voces.py` están fijados por SHA-256 contra ellas.
audio = [
    "kokoro-onnx==0.6.1",
    "piper-tts==1.8.0",
]
# XTTS-v2, solo como opción administrativa (`TTS_MOTOR=xtts`). Va aparte porque
# arrastra torch y choca con el resto de la pila (gruut pide numpy<2, TTS 0.22
# pide pandas<2). Modelo bajo licencia CPML: solo uso no comercial.
audio-xtts = [
    "torch>=2.4.0",
    "torchaudio>=2.4.0",
    "TTS>=0.22.0",
]
# Generación de imágenes (Fase 6), hoy sin uso desde la API (H5).
media = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "diffusers>=0.30.0",
    "transformers>=4.44.0",
    "accelerate>=0.33.0",
    "sentencepiece>=0.2.0",
    "imageio-ffmpeg>=0.5.1",
]
# Ingesta documental (Fase 2). Se instala aparte para no arrastrar binarios pesados
# mientras se trabaja en las fases 0-1.
ingest = [
    "pymupdf>=1.24",
    "python-pptx>=1.0",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studify"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Las migraciones las escribe `alembic revision --autogenerate` con su propio
# formato (líneas largas, imports sin ordenar). Reformatearlas a mano se
# perdería en la siguiente regeneración, así que quedan fuera del lint.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# `db: Session = Depends(get_db)` es la forma canónica de declarar dependencias
# en FastAPI; B008 la marca porque en general llamar funciones en los defaults
# es un bug, pero acá el framework resuelve la llamada en cada request.
# `File` y `Form` son el mismo idioma para subida de archivos y formularios.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.File",
    "fastapi.Form",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
