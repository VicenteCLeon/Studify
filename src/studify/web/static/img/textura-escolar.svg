    <g transform="translate(40,50) rotate(-10)"><rect x="0" y="0" width="46" height="34" rx="2"/><line x1="23" y1="0" x2="23" y2="34"/><line x1="6" y1="9" x2="18" y2="9"/><line x1="6" y1="17" x2="18" y2="17"/></g>
